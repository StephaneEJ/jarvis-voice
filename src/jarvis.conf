# Configuration Jarvis — Feedback vocal OpenCode + Claude Code
#
# JARVIS_ENABLED : activer ou désactiver le feedback vocal
#   true  → Jarvis parle
#   false → silence total
#
# JARVIS_MODE : niveau de détail du résumé final
#   court  → 2-3 phrases (recommandé)
#   detail → résumé plus complet
#   coach  → lecture intégrale des réponses
#
# JARVIS_VOICE : voix Edge TTS (nécessite internet)
#   Masculines : fr-FR-HenriNeural, fr-FR-RemyMultilingualNeural
#   Féminines  : fr-FR-DeniseNeural, fr-FR-EloiseNeural
#   Sans internet → fallback automatique (say sur Mac, espeak sur Linux, PowerShell sur Windows)
#
# JARVIS_RATE : débit de la voix Edge TTS
#   Exemples : +0% (normal), +25% (recommandé), +40% (rapide), +50% (très rapide)
#
# JARVIS_TRANSCRIPT : activer le log de conversation (mode coach)
#   true  → log dans /tmp/jarvis-coach-transcript.jsonl
#   false → pas de log
#
# JARVIS_NOTIFY : annonce "j'ai besoin de toi" quand l'IA demande une permission
#   true  → Jarvis t'interpelle (recommandé)
#   false → silencieux sur les demandes de permission (le reste reste actif)
#   Toggle : `jarvis notify on|off`
#
# Alertes du Cockpit (`jarvis alertes`, voir docs/ALERTES-COCKPIT.md) — valeurs par défaut :
#   JARVIS_ALERTES=on                      off → aucune annonce de blocage
#   JARVIS_COCKPIT_DIR=~/OBSIDIAN/2ND_CERVEAU/_System/Jarvis/Cockpit
#   JARVIS_ALERTES_SILENCE=22-07           plage muette (heure locale), « aucun » pour désactiver
#   JARVIS_ALERTES_ECART_S=300             écart minimal entre deux annonces immédiates
#   JARVIS_POINT_MINUTES=30                point périodique (0 → seulement à la demande)
#   JARVIS_ALERTES_AGE_MAX_MIN=30          plus vieux : va au point, pas en annonce
#   JARVIS_ALERTES_IMMEDIATES=autorisation_probable,erreur,interrompue,decision

JARVIS_ENABLED=true
JARVIS_MODE=court
JARVIS_VOICE=fr-FR-HenriNeural
JARVIS_RATE=+25%
JARVIS_TRANSCRIPT=false
JARVIS_NOTIFY=true
